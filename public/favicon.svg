<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The hero orb, reduced to something legible at 16px: a ring, its horizon
    ellipse, and a solid core. Detail below ~3px of stroke disappears in a
    browser tab, so there is deliberately none.
  -->
  <rect width="64" height="64" rx="14" fill="#08090c"/>
  <circle cx="32" cy="32" r="19" fill="none" stroke="#e8a33d" stroke-width="3.5"/>
  <ellipse cx="32" cy="32" rx="19" ry="7.5" fill="none" stroke="#e8a33d" stroke-width="2.4" opacity="0.7"/>
  <circle cx="32" cy="32" r="5.5" fill="#e8a33d"/>
</svg>
