<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Orbelis Studio</title>
    <meta
      name="description"
      content="That page does not exist. Here are the parts of Orbelis Studio you were most likely looking for."
    />
    <meta name="theme-color" content="#08090c" />
    <!--
      Set the theme before anything paints: a stored choice if there is one,
      otherwise the system setting. Inline on purpose — waiting for the bundle
      would flash the dark page at visitors who chose light.
    -->
    <script>
      ;(function () {
        var t = 'dark'
        try {
          var s = localStorage.getItem('theme')
          t = s === 'light' || s === 'dark' ? s : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        } catch (e) {}
        document.documentElement.dataset.theme = t
        if (t === 'light') document.querySelector('meta[name="theme-color"]').content = '#ffffff'
      })()
    </script>
    <!-- Soft-404s poison a small site's index; keep this page out of it. -->
    <meta name="robots" content="noindex, follow" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-page="404">
    <div id="root"></div>
    <script type="module" src="/src/legal.jsx"></script>
  </body>
</html>
