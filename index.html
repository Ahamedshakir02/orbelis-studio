    <!--
      Set the theme before anything paints: a stored choice if there is one,
      otherwise the system setting. Inline on purpose — waiting for the bundle
      would flash the dark page at visitors who chose light.
    -->
    <script>
      ;(function () {
        var t = 'dark'
        try {
          var s = localStorage.getItem('theme')
          t = s === 'light' || s === 'dark' ? s : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        } catch (e) {}
        document.documentElement.dataset.theme = t
        document.documentElement.classList.add('loading')
        if (t === 'light') document.querySelector('meta[name="theme-color"]').content = '#ffffff'
      })()
    </script>

    <!--
      The loader's styles are inline for the same reason its markup is: it has
      to be on screen before the stylesheet arrives. The wordmark is revealed
      left to right, then its full stop lands and breathes while the page
      finishes. The letters are outlines, not text, because the brand face has
      not loaded yet either. src/lib/loader.js takes it away.
    -->
    <style>
      #loader {
        position: fixed;
        inset: 0;
        z-index: 400;
        display: grid;
        place-items: center;
        background: #08090c;
        transition: opacity 0.45s ease, visibility 0.45s;
        /* If the script never runs, do not hold the page hostage. */
        animation: ld-giveup 0.4s ease 8s forwards;
      }
      [data-theme='light'] #loader { background: #ffffff; }
      #loader.done { opacity: 0; visibility: hidden; }
      #loader svg { width: 188px; height: auto; overflow: visible; }
      #loader .word {
        fill: #e8eaf0;
        clip-path: inset(0 100% 0 0);
        animation: ld-reveal 0.75s cubic-bezier(0.6, 0, 0.2, 1) forwards;
      }
      [data-theme='light'] #loader .word { fill: #08090c; }
      #loader .stop {
        fill: #e8a33d;
        transform-box: fill-box;
        transform-origin: 50% 100%;
        transform: scale(0);
        animation:
          ld-pop 0.45s cubic-bezier(0.2, 1.4, 0.4, 1) 0.65s forwards,
          ld-breathe 1.6s ease-in-out 1.1s infinite;
      }
      html.loading { overflow: hidden; }
      @keyframes ld-reveal { to { clip-path: inset(0 0 0 0); } }
      @keyframes ld-pop { to { transform: scale(1); } }
      @keyframes ld-breathe { 50% { opacity: 0.4; } }
      @keyframes ld-giveup { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        #loader .word { clip-path: none; animation: none; }
        #loader .stop { transform: none; animation: none; }
      }
    </style>
    <noscript><style>#loader { display: none; }</style></noscript>
  </head>
