<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbelis Studio — Automate the busywork. Answer every enquiry.</title>
    <meta
      name="description"
      content="Orbelis Studio automates the repetitive work in a business, adds an AI assistant that answers from your own content, and builds the fast website they run on. Kerala-based, working with brands, clinics, institutions and founders."
    />
    <meta name="theme-color" content="#08090c" />
    <!--
      Set the theme before anything paints: a stored choice if there is one,
      otherwise the system setting. Inline on purpose — waiting for the bundle
      would flash the dark page at visitors who chose light.
    -->
    <script>
      ;(function () {
        var t = 'dark'
        try {
          var s = localStorage.getItem('theme')
          t = s === 'light' || s === 'dark' ? s : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        } catch (e) {}
        document.documentElement.dataset.theme = t
        document.documentElement.classList.add('loading')
        if (t === 'light') document.querySelector('meta[name="theme-color"]').content = '#ffffff'
      })()
    </script>
    <link rel="canonical" href="https://orbelisstudio.com/" />

    <!-- Regenerate the PNGs with `npm run icons` after editing favicon.svg. -->

    <!--
      The loader's styles are inline for the same reason its markup is: it has
      to be on screen before the stylesheet arrives. The logo draws itself —
      ring, then horizon, then the core — and the core breathes while the page
      finishes. src/lib/loader.js takes it away.
    -->
    <style>
      #loader {
        position: fixed;
        inset: 0;
        z-index: 400;
        display: grid;
        place-items: center;
        background: #08090c;
        transition: opacity 0.45s ease, visibility 0.45s;
        /* If the script never runs, do not hold the page hostage. */
        animation: ld-giveup 0.4s ease 8s forwards;
      }
      [data-theme='light'] #loader { background: #ffffff; }
      #loader.done { opacity: 0; visibility: hidden; }
      #loader svg { width: 76px; height: 76px; overflow: visible; }
      #loader .ring,
      #loader .horizon {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: ld-draw 0.85s cubic-bezier(0.6, 0, 0.2, 1) forwards;
      }
      #loader .horizon { animation-delay: 0.22s; }
      #loader .core {
        transform-origin: 32px 32px;
        transform: scale(0);
        animation:
          ld-pop 0.45s cubic-bezier(0.2, 1.4, 0.4, 1) 0.6s forwards,
          ld-breathe 1.6s ease-in-out 1.1s infinite;
      }
      html.loading { overflow: hidden; }
      @keyframes ld-draw { to { stroke-dashoffset: 0; } }
      @keyframes ld-pop { to { transform: scale(1); } }
      @keyframes ld-breathe { 50% { opacity: 0.4; } }
      @keyframes ld-giveup { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        #loader .ring, #loader .horizon { stroke-dashoffset: 0; animation: none; }
        #loader .core { transform: none; animation: none; }
      }
    </style>
    <noscript><style>#loader { display: none; }</style></noscript>
  </head>
  <body>
    <div id="loader" role="status" aria-label="Loading Orbelis Studio">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle class="ring" cx="32" cy="32" r="19" fill="none" stroke="#e8a33d" stroke-width="3.5" stroke-linecap="round" pathLength="1" transform="rotate(-90 32 32)" />
        <ellipse class="horizon" cx="32" cy="32" rx="19" ry="7.5" fill="none" stroke="#e8a33d" stroke-width="2.4" stroke-linecap="round" opacity="0.7" pathLength="1" />
        <circle class="core" cx="32" cy="32" r="5.5" fill="#e8a33d" />
      </svg>
    </div>
    <div id="root"></div>
    <noscript>
      Orbelis Studio — fast, clear websites with AI assistants built in.
      Email hello@orbelisstudio.com
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
